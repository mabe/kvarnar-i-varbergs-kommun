- name: Ättehögens kvarn
  location: Sunvära 9, Värö
  slug: attehogens-kvarn
  owner: Anders Johansson, Sunvära 23 och Jenny Karlsson, Sunvära 9
  type: Hättkvarn, typ A, av litet format
  age: Exakt ålder okänd. Ursprungligen uppförd på Ättehögens gravfält, men flyttad till nuvarande läge 1878. Uppfördes gemensamt av de två gårdarna i Sunvära 9.
  milling_type: Husbehovskvarn för de båda Sunväragårdarna. I drift till 1938.
  condition: Åttkantig, spånklädd kvarnbyggnad i två våningar. Uppförd på 10 m bred stenaltan. Har endast ett par stenar. Byggnaden är sammanfogad enbart med träsplintar. Kvarnen är grovt förfallen, med ena sidan helt genombruten, och borttagna vingar.
- name: Ås väderkvarn
  location: Ås
  slug: as-vaderkvarn
  owner: Sven Svensson, Ås 6:8. Kvarnen underhålls och disponeras av Veddige Hembygdsförening.
  type: Hättkvarn, typ A, av mycket stort format
  age: Exakt ålder okänd. Kvarnen lär vara flyttad från Stafsinge, men har legat på nuvarande plats i ca. 100 år.
  milling_type: Tullkvarn — bygdekvarn, i drift till 1965
  condition: Kvarnen är en mycket kraftig åttkantig hättkvarn i fyra våningar, varav de två nedre är byggda i sten. De två övre våningarna är klädda med bruna bräder. Hättan är täckt med tjärpapp. Invändigt är kvarnen i gott skick. Dock är endast ett stenpar bevarat. Vingar saknas. Hättan har vridits i läge av en vindrosett, varför ställverk saknas. Byggnaden är i gott skick.
